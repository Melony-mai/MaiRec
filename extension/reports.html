<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="reports_title">Reports</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="page_reports">
    <header class="header">
      <div class="brand">
        <h1 data-i18n="reports_title">Reports</h1>
      </div>
      <button id="theme_toggle_btn" class="theme-toggle-btn" type="button" aria-label="Toggle theme" title="Switch to light mode">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </header>

    <section class="settings-group">
      <div class="card">
        <div class="setting-row">
          <span class="setting-label" data-i18n="enable_reports">Enable reports (disabled)</span>
          <label class="switch"><input type="checkbox" id="rep_enabled" disabled><span class="slider"></span></label>
        </div>

        <div class="setting-row-block">
          <label class="setting-label" id="rep_key_label" data-i18n="rep_key_label_16_32">API key (16 or 32 chars)</label>
          <input type="text" id="rep_key" class="mac-input" pattern="[0-9a-z]{16}([0-9a-z]{16})?" maxlength="32" placeholder="secretkey0123456" spellcheck="false" autocomplete="off">
        </div>

        <div class="setting-row-action">
          <button id="rep_send" class="btn btn-secondary btn-full" data-i18n="btn_send_reports">Send reports</button>
          <div id="rep_status" class="status-message"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="reports.js"></script>
</body>
</html>
